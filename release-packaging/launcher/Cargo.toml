[package]
name = "du-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "diskunfold"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:du-app-host", "du-app-host/gui"]

[dependencies]
du-cli = { version = "0.1.0", path = "../../cli" }
du-app-host = { version = "0.1.0", path = "../../app-host", optional = true }

[lints]
workspace = true
