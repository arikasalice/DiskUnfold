# Permitted direct dependencies between product crates, independent of dependency kind.
[crates]
launcher = ["app-host", "cli"]
app-host = ["engine-api", "change-executor", "mcp-gateway", "user-env", "platform-os", "app-db", "snapshot-files", "core-contracts"]
cli = ["engine-api", "user-env", "platform-os", "app-db", "snapshot-files", "core-contracts"]
mcp-gateway = ["engine-api", "core-contracts"]
engine-api = ["core-contracts", "job-runtime", "scan-engine", "analysis-index", "snapshot-store", "duplicate-engine", "change-planner", "share-policy", "export-render", "guidance-rules"]
change-executor = ["change-planner", "job-runtime", "analysis-index", "core-contracts"]
scan-engine = ["analysis-index", "job-runtime", "core-contracts"]
snapshot-store = ["analysis-index", "core-contracts"]
duplicate-engine = ["analysis-index", "job-runtime", "core-contracts"]
change-planner = ["analysis-index", "core-contracts"]
export-render = ["share-policy", "analysis-index", "core-contracts"]
job-runtime = ["core-contracts"]
analysis-index = ["core-contracts"]
share-policy = ["core-contracts"]
guidance-rules = ["core-contracts"]
user-env = ["core-contracts"]
platform-os = ["core-contracts"]
app-db = ["core-contracts"]
snapshot-files = ["core-contracts"]
core-contracts = []
arch-check = []
release-tools = ["app-db", "snapshot-store"]
