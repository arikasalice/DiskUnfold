<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350"><rect width="960" height="350" fill="#f5f5f6"/><circle cx="20" cy="22" r="6" fill="#ff5f57"/><circle cx="40" cy="22" r="6" fill="#febc2e"/><circle cx="60" cy="22" r="6" fill="#28c840"/><image href="data:image/svg+xml;base64," x="78" y="12" width="20" height="20"/><text x="106" y="26.5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="650" fill="#242528" text-anchor="start">DiskUnfold</text><text x="182" y="26.5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#d9dce1" text-anchor="start">/</text><text x="194" y="26.5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#626771" text-anchor="start">시작 점검</text><path d="M0 43.5H960" stroke="#d9dce1" stroke-width="1"/><text x="36" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="660" fill="#242528" text-anchor="start">시작 상태와 개인정보 보호</text><text x="36" y="118" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#626771" text-anchor="start">이 Mac의 시작 점검과 전체 디스크 접근 권한을 확인합니다.</text><rect x="36" y="138" width="430" height="64" rx="10" fill="#ffffff" stroke="#d9dce1"/><rect x="482" y="138" width="442" height="64" rx="10" fill="#ffffff" stroke="#d9dce1"/><path d="M630 0V44M626 0h8M626 44h8" stroke="#8a3ffc" stroke-width="1" fill="none"/><text x="638" y="26" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8a3ffc" text-anchor="start">44 상단 바</text><path d="M710 44V68M706 44h8M706 68h8" stroke="#8a3ffc" stroke-width="1" fill="none"/><text x="718" y="60" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8a3ffc" text-anchor="start">24 본문 상단 여백</text><rect x="0" y="232" width="960" height="118" fill="#ffffff"/><path d="M0 232.5H960" stroke="#d9dce1"/><text x="24" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#242528" text-anchor="start">macOS · 투명 제목 영역 + 앱 상단 바 · Light</text><text x="24" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#626771" text-anchor="start">· 높이 44 · 배경 = 페이지 배경(투명 제목 영역) · 아래 1px 구분선</text><text x="24" y="295" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#626771" text-anchor="start">· 왼쪽 78px는 신호등 예약 영역, 오른쪽 여백 12px</text><text x="24" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#626771" text-anchor="start">· 전체 화면에서는 신호등이 사라지므로 왼쪽 여백 12px</text><text x="24" y="329" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#626771" text-anchor="start">· 빈 영역 전체가 창 끌기 영역, 더블클릭은 OS 확대 동작</text></svg>