<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350"><rect width="960" height="350" fill="#18191c"/><image href="data:image/svg+xml;base64," x="12" y="10" width="20" height="20"/><text x="40" y="24.5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="650" fill="#f1f2f4" text-anchor="start">DiskUnfold</text><text x="116" y="24.5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#41454d" text-anchor="start">/</text><text x="128" y="24.5" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#b3b6bd" text-anchor="start">시작 점검</text><path d="M840 20h10" stroke="#f1f2f4" stroke-width="1"/><rect x="886" y="15" width="10" height="10" fill="none" stroke="#f1f2f4" stroke-width="1"/><path d="M932 15l10 10M942 15l-10 10" stroke="#f1f2f4" stroke-width="1"/><path d="M0 39.5H960" stroke="#41454d" stroke-width="1"/><text x="36" y="86" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="660" fill="#f1f2f4" text-anchor="start">시작 상태와 개인정보 보호</text><text x="36" y="114" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#b3b6bd" text-anchor="start">이 Mac의 시작 점검과 전체 디스크 접근 권한을 확인합니다.</text><rect x="36" y="134" width="430" height="64" rx="10" fill="#202226" stroke="#41454d"/><rect x="482" y="134" width="442" height="64" rx="10" fill="#202226" stroke="#41454d"/><path d="M630 0V40M626 0h8M626 40h8" stroke="#c9a6ff" stroke-width="1" fill="none"/><text x="638" y="24" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#c9a6ff" text-anchor="start">40 상단 바</text><path d="M710 40V64M706 40h8M706 64h8" stroke="#c9a6ff" stroke-width="1" fill="none"/><text x="718" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#c9a6ff" text-anchor="start">24 본문 상단 여백</text><rect x="0" y="232" width="960" height="118" fill="#202226"/><path d="M0 232.5H960" stroke="#41454d"/><text x="24" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#f1f2f4" text-anchor="start">Windows · WebView2 상단 바 + 기본 캡션 버튼 · Dark</text><text x="24" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#b3b6bd" text-anchor="start">· 높이 40 · 배경 = 페이지 배경 · 아래 1px 구분선</text><text x="24" y="295" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#b3b6bd" text-anchor="start">· 왼쪽 여백 12px, 오른쪽 138px(46×3)는 기본 캡션 버튼 예약 영역</text><text x="24" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#b3b6bd" text-anchor="start">· 캡션 버튼은 OS가 그리며 앱은 그 영역에 아무것도 두지 않음</text><text x="24" y="329" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#b3b6bd" text-anchor="start">· 빈 영역 전체가 창 끌기 영역, 최대화 시에도 같은 규칙</text></svg>