<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350"><rect width="960" height="350" fill="#f5f5f6"/><rect x="0" y="0" width="960" height="46" fill="#ffffff"/><text x="480" y="21" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#242528" text-anchor="middle">DiskUnfold</text><text x="480" y="37" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#626771" text-anchor="middle">시작 점검</text><circle cx="870" cy="23" r="12" fill="#e5e7ea"/><path transform="translate(870 23)" d="M-4 0h8" stroke="#242528" stroke-width="1.2" fill="none"/><circle cx="904" cy="23" r="12" fill="#e5e7ea"/><path transform="translate(904 23)" d="M-4 -4h8v8h-8z" stroke="#242528" stroke-width="1.2" fill="none"/><circle cx="938" cy="23" r="12" fill="#e5e7ea"/><path transform="translate(938 23)" d="M-4 -4l8 8M4 -4l-8 8" stroke="#242528" stroke-width="1.2" fill="none"/><path d="M0 45.5H960" stroke="#d9dce1" stroke-width="1"/><text x="36" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="22" font-weight="660" fill="#242528" text-anchor="start">시작 상태와 개인정보 보호</text><text x="36" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#626771" text-anchor="start">이 Mac의 시작 점검과 전체 디스크 접근 권한을 확인합니다.</text><rect x="36" y="140" width="430" height="64" rx="10" fill="#ffffff" stroke="#d9dce1"/><rect x="482" y="140" width="442" height="64" rx="10" fill="#ffffff" stroke="#d9dce1"/><path d="M630 0V46M626 0h8M626 46h8" stroke="#8a3ffc" stroke-width="1" fill="none"/><text x="638" y="27" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8a3ffc" text-anchor="start">46 상단 바</text><path d="M710 46V70M706 46h8M706 70h8" stroke="#8a3ffc" stroke-width="1" fill="none"/><text x="718" y="62" font-family="Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="#8a3ffc" text-anchor="start">24 본문 상단 여백</text><rect x="0" y="232" width="960" height="118" fill="#ffffff"/><path d="M0 232.5H960" stroke="#d9dce1"/><text x="24" y="256" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#242528" text-anchor="start">Linux · GTK4 헤더바 · Light</text><text x="24" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#626771" text-anchor="start">· 네이티브 GtkHeaderBar 사용 · 높이와 버튼 모양은 GTK 테마를 따름</text><text x="24" y="295" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#626771" text-anchor="start">· 제목 = DiskUnfold, 부제 = 현재 위치 · 로고는 넣지 않음</text><text x="24" y="312" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#626771" text-anchor="start">· 버튼 위치는 데스크톱 설정(gtk-decoration-layout)을 따름</text><text x="24" y="329" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#626771" text-anchor="start">· 웹 화면 안에는 상단 바를 그리지 않음 (--du-titlebar-height: 0)</text></svg>