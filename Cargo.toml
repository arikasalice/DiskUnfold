[workspace]
resolver = "3"
members = [
    "app-host",
    "mcp-gateway",
    "cli",
    "core-contracts",
    "engine-api",
    "job-runtime",
    "scan-engine",
    "analysis-index",
    "snapshot-store",
    "duplicate-engine",
    "change-planner",
    "change-executor",
    "share-policy",
    "export-render",
    "platform-os",
    "guidance-rules",
    "user-env",
    "app-db",
    "snapshot-files",
    "release-packaging/launcher",
    "release-packaging/arch-check",
    "release-packaging/release-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
base64 = "=0.23.1"
blake3 = "=1.8.3"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "=3.0.10", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
toml = "1"
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
uuid = { version = "1.29", features = ["serde"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cognitive_complexity = "deny"
