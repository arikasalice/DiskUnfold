name: Install Linux packages with cached downloads
description: >-
  Installs apt packages and keeps the downloaded .deb files in the Actions cache. The Azure Ubuntu
  mirror can take 15 minutes or more for the GTK and WebKit packages. The cache only supplies files:
  apt still refreshes the index and checks every cached .deb against it, so a missing, stale or
  corrupt cache falls back to downloading from the mirror.
inputs:
  packages:
    description: Space separated apt package names.
    required: true
runs:
  using: composite
  steps:
    - id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      # The exact key ends with the runner image version so a changed image saves a fresh cache.
      # The prefix key leaves the version out: a run on another image still restores the files of
      # an earlier image, and apt only downloads the packages whose versions differ.
      run: |
        set -euo pipefail
        missing=0
        for pkg in $PACKAGES; do
          if ! dpkg-query -W -f='${Status}\n' "$pkg" 2>/dev/null | grep -qx 'install ok installed'; then
            missing=1
            break
          fi
        done
        if [[ "$missing" -eq 0 ]]; then
          echo "All requested apt packages are already installed: $PACKAGES"
          echo "installed=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "installed=false" >> "$GITHUB_OUTPUT"
        digest="$(printf '%s\n' $PACKAGES | sort -u | sha256sum | cut -c1-16)"
        prefix="apt-debs-v2-$RUNNER_OS-$RUNNER_ARCH-$digest-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=$prefix${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: steps.key.outputs.installed != 'true'
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "5"
      with:
        path: ~/apt-debs
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: Install packages
      if: steps.key.outputs.installed != 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/apt-debs"
        sudo cp -n "$HOME"/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
        sudo apt-get update
        sudo apt-get install -y $PACKAGES
        # Drop superseded versions, then keep exactly what apt holds now for the next cache.
        sudo apt-get autoclean || true
        rm -f "$HOME"/apt-debs/*.deb
        sudo cp /var/cache/apt/archives/*.deb "$HOME/apt-debs/" 2>/dev/null || true
        sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-debs"
