name: Fuzz
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: quality-output/fuzz-corpus/
          key: fuzz-corpus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release-packaging/quality/fuzz-targets.json') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release-packaging/quality/fuzz-targets.json') }}-
      - run: node release-packaging/quality/fuzz.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-report
          path: quality-output/fuzz-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-crashes
          path: quality-output/fuzz-crashes/
          retention-days: 90
          if-no-files-found: ignore
