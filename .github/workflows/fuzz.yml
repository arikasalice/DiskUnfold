name: Fuzz
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: quality-output/fuzz-corpus/
          key: fuzz-corpus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release-packaging/quality/fuzz-targets.json') }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release-packaging/quality/fuzz-targets.json') }}-
      - run: node release-packaging/quality/fuzz.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzz-report
          path: quality-output/fuzz-report.json
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fuzz-crashes
          path: quality-output/fuzz-crashes/
          retention-days: 90
          if-no-files-found: ignore
