name: Quality
on:
  pull_request:
  push:
    branches: [main, 0.0.1]
  # Manual runs exist so a branch can warm and measure the Rust caches (see the caching policy in
  # release-packaging/quality/README.md). They never publish anything.
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Runner selection mode (auto: real-time self-hosted probe with fallback, github-hosted)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - github-hosted
      ui_smoke_tier:
        description: "UI smoke scenario tier (auto: smoke on PR and all on push/manual, smoke, all)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - smoke
          - all
permissions:
  contents: read
# A newer push to the same pull request replaces the older run. Default-branch pushes and manual
# runs get a unique group and are never cancelled: every commit keeps its own coverage baseline.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('quality-pr-{0}', github.event.pull_request.number) || format('quality-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # CI-only compile settings. Cargo.toml profiles, and so release builds, are untouched.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - id: matrix
        name: Resolve target runners and build GUI assets in parallel
        shell: bash
        env:
          DU_RUNNER_MODE: ${{ inputs.runner_mode || 'auto' }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node release-packaging/quality/matrix.mjs &
          pid_matrix=$!
          (
            cd gui-web
            npm ci --ignore-scripts
            npm run build
          ) &
          pid_gui=$!
          wait "$pid_matrix"
          wait "$pid_gui"
      - name: Stage GUI dist and production license metadata
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const out = "quality-output/gui-dist";
            fs.cpSync("gui-web/dist", path.join(out, "dist"), { recursive: true });
            const lock = JSON.parse(fs.readFileSync("gui-web/package-lock.json", "utf8"));
            const stems = ["LICENSE", "LICENCE", "COPYING", "NOTICE", "UNLICENSE"];
            for (const [pkgPath, pkg] of Object.entries(lock.packages || {})) {
              if (!pkgPath || pkg.dev === true) continue;
              const srcDir = path.join("gui-web", pkgPath);
              if (!fs.existsSync(srcDir)) continue;
              const dstDir = path.join(out, pkgPath);
              fs.mkdirSync(dstDir, { recursive: true });
              for (const entry of fs.readdirSync(srcDir, { withFileTypes: true })) {
                if (!entry.isFile()) continue;
                const upper = entry.name.toUpperCase();
                if (entry.name === "package.json" || stems.some((s) => upper.startsWith(s))) {
                  fs.cpSync(path.join(srcDir, entry.name), path.join(dstDir, entry.name));
                }
              }
            }
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targets
          path: quality-output/targets.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-dist
          path: quality-output/gui-dist/
          if-no-files-found: error
  # Unified native target check: one job per (OS, CPU) target so self-hosted runners (1 per target)
  # never queue two competing jobs on the same machine, and pre-built GUI assets are reused.
  native:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download pre-built GUI assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-dist
          path: gui-web
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        # A slow mirror needs about 17 minutes; the limit only stops a hung download.
        timeout-minutes: 35
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config xvfb openbox xdotool dbus-x11 curl ca-certificates
      - name: Install pinned Rust (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          EXPECTED_RUST_TARGET: ${{ matrix.rustTarget }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'C:\Program Files\Git\bin') {
            'C:\Program Files\Git\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:PATH = "C:\Program Files\Git\bin;$env:PATH"
          }
          if ($env:RUNNER_ENVIRONMENT -eq 'self-hosted' -or -not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $rustRoot = Join-Path (Split-Path $env:RUNNER_TEMP -Parent) 'rust'
            $cargoHome = Join-Path $rustRoot 'cargo'
            $rustupHome = Join-Path $rustRoot 'rustup'
            New-Item -ItemType Directory -Force -Path $cargoHome, $rustupHome | Out-Null
            "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "RUSTUP_HOME=$rustupHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "$cargoHome\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            $env:CARGO_HOME = $cargoHome
            $env:RUSTUP_HOME = $rustupHome
            $env:PATH = "$cargoHome\bin;$env:PATH"
            if (-not (Test-Path "$cargoHome\bin\rustup.exe")) {
              $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
              Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $init
              & $init -y --default-toolchain none --no-modify-path
              if ($LASTEXITCODE -ne 0) { throw "rustup-init failed with exit code $LASTEXITCODE" }
            }
          }
          $toolchain = "1.99.1-$env:EXPECTED_RUST_TARGET"
          & rustup toolchain install $toolchain --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install failed" }
          "RUSTUP_TOOLCHAIN=$toolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $env:RUSTUP_TOOLCHAIN = $toolchain
          $hostLine = (& rustc -vV) | Where-Object { $_ -eq "host: $env:EXPECTED_RUST_TARGET" }
          if (-not $hostLine) { throw "Expected host: $env:EXPECTED_RUST_TARGET, got: $(& rustc -vV)" }
      - name: Install pinned Rust (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          EXPECTED_RUST_TARGET: ${{ matrix.rustTarget }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" ]]; then
            # Isolate CARGO_HOME per runner workdir so mac-m1-arm and mac-m1-intel sharing a host
            # user account never contend on ~/.cargo package locks or cache archives.
            export CARGO_HOME="$(dirname "$RUNNER_TEMP")/cargo"
            mkdir -p "$CARGO_HOME/bin"
            echo "CARGO_HOME=$CARGO_HOME" >> "$GITHUB_ENV"
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
            export PATH="$CARGO_HOME/bin:$PATH"
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.rustup"
          lockdir="$HOME/.rustup/.ci-install.lock"
          while ! mkdir "$lockdir" 2>/dev/null; do sleep 1; done
          trap 'rmdir "$lockdir" 2>/dev/null || true' EXIT
          if ! command -v rustup >/dev/null 2>&1; then
            CARGO_HOME="$HOME/.cargo" curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          toolchain="1.99.1-$EXPECTED_RUST_TARGET"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          export RUSTUP_TOOLCHAIN="$toolchain"
          rustc -vV | grep -Fx "host: $EXPECTED_RUST_TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}-${{ matrix.cpu }}-${{ matrix.rustTarget }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.0.1' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The CLI-only launcher (README, AGENTS.md) builds app-host without its gui feature.
      - run: cargo clippy --locked -p du-launcher -p du-app-host --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Windows NTFS volume mount-point observation
        if: runner.os == 'Windows' && matrix.cpu == 'x64'
        run: cargo test --locked -p du-platform-os --test windows_mountpoint -- --ignored --nocapture
      # A separate install keeps the cache key of the GTK and WebKit packages unchanged.
      - name: Linux btrfs tools
        if: runner.os == 'Linux' && matrix.cpu == 'x64'
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          packages: btrfs-progs
      - name: Linux btrfs subvolume observation
        if: runner.os == 'Linux' && matrix.cpu == 'x64'
        shell: bash
        # A fresh loop image: subvolumes first, second and second/nested (IDs 256, 257, 258).
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/du-btrfs.img"
          root="$RUNNER_TEMP/du-btrfs"
          rm -f "$image"
          mkdir -p "$root"
          truncate -s 256M "$image"
          mkfs.btrfs -q "$image"
          sudo -n mount -o loop "$image" "$root"
          trap 'sudo -n umount "$root" || sudo -n umount -l "$root"; rm -f "$image"; rmdir "$root"' EXIT
          for name in first second second/nested; do
            sudo -n btrfs subvolume create "$root/$name"
          done
          sudo -n chown -R "$(id -u):$(id -g)" "$root"
          mkdir "$root/plain"
          printf '0123456789' > "$root/plain/a.bin"
          printf '%020d' 0 > "$root/first/b.bin"
          printf '12345' > "$root/second/c.bin"
          export DU_TEST_BTRFS_ROOT="$root"
          cargo test --locked -p du-platform-os --test linux_btrfs_subvolume -- --ignored --nocapture
          cargo test --locked -p du-app-host --all-features --lib linux_scan_leaves_btrfs_subvolumes_outside_the_boundary -- --ignored --nocapture
      # Ubuntu 24.04 runners set kernel.apparmor_restrict_unprivileged_userns=1, which
      # blocks the unprivileged user namespace that WebKitGTK's bubblewrap sandbox needs.
      - name: Allow unprivileged user namespaces for the WebKit sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
      - name: Linux launch smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bwrap >/dev/null 2>&1 || ! bwrap --ro-bind / / /bin/true >/dev/null 2>&1; then
            export WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1
          fi
          [[ -x target/debug/diskunfold ]] || cargo build --locked -p du-launcher
          bash release-packaging/launcher/smoke-linux.sh target/debug/diskunfold
          xvfb-run -a dbus-run-session cargo test --locked -p du-platform-os --features webview linux_webview_smoke -- --ignored
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.cpu }}
          path: quality-output/
          if-no-files-found: ignore
  # Platform-independent formatting, architecture, contract diff, GUI checks/tests, dependency,
  # license, workflow and duplication policy on a fast GitHub-hosted Linux runner.
  # Rust/Cargo checks and GUI/Node checks run in parallel to minimize wall-clock time.
  policy:
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: policy
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.0.1' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - working-directory: gui-web
        run: npm ci --ignore-scripts
      - name: Run Rust policy, contract, and GUI checks in parallel
        shell: bash
        run: |
          set -euo pipefail
          (
            cargo fmt --all -- --check
            cargo run --locked -p du-arch-check --
            generated_dir=$(mktemp -d)
            cargo run --locked -p du-core-contracts --features typescript --example export_types -- "$generated_dir"
            git diff --no-index --no-ext-diff -- gui-web/src/ipc/generated "$generated_dir"
            if ! command -v cargo-deny >/dev/null 2>&1 || [[ "$(cargo-deny --version)" != "cargo-deny $CARGO_DENY_VERSION" ]]; then
              cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
            fi
            cargo deny --locked --all-features check advisories licenses sources bans
          ) &
          pid_rust=$!

          (
            cd gui-web
            npm run typecheck &
            p1=$!
            npm run lint &
            p2=$!
            npm run format:check &
            p3=$!
            npm run arch &
            p4=$!
            npm run locale:check &
            p5=$!
            wait "$p1" "$p2" "$p3" "$p4" "$p5"
            npm run test
          ) &
          pid_gui=$!

          (
            node --test platform-os/tests/windows_drop_bridge.test.cjs
            node --test release-packaging/quality/npm-licenses.test.mjs
            node --test release-packaging/quality/windows-ui-smoke.test.mjs
            node release-packaging/quality/npm-licenses.mjs
            node release-packaging/quality/dependency-register.mjs
            node --test release-packaging/release
            node release-packaging/release/lint-workflow.mjs
            node --test release-packaging/quality/coverage.test.mjs
            node --test release-packaging/quality/matrix.test.mjs
            node --test release-packaging/quality/fuzz.test.mjs
            node release-packaging/quality/fuzz.mjs --check
            gui-web/node_modules/.bin/jscpd --min-tokens 50 --reporters json,html --output quality-output/jscpd --ignore '**/node_modules/**,**/target/**,**/gen/**,**/dist/**,**/generated/**,**/coverage/**,**/quality-output/**' .
          ) &
          pid_node_policy=$!

          wait "$pid_rust"
          wait "$pid_gui"
          wait "$pid_node_policy"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-policy
          path: quality-output/
          if-no-files-found: warn
  # Real WebView2 window on an isolated interactive Windows desktop runner (windows-2022): starts
  # immediately at t=0 in parallel with targets/native instead of waiting in queue behind them.
  ui-smoke:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - name: Install pinned Rust and build GUI assets in parallel
        shell: bash
        run: |
          set -euo pipefail
          (rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1) &
          pid_rust=$!
          (cd gui-web && npm ci --ignore-scripts && npm run build) &
          pid_gui=$!
          wait "$pid_rust"
          wait "$pid_gui"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-ui-smoke
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.0.1' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - run: cargo build --locked -p du-launcher
      - name: Run UI scenarios
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TIER: ${{ inputs.ui_smoke_tier || 'auto' }}
        run: |
          $tier = if ($env:REQUESTED_TIER -in @('smoke', 'all')) {
            $env:REQUESTED_TIER
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            'smoke'
          } else {
            'all'
          }
          "Running Windows UI smoke with tier '$tier'"
          ./release-packaging/quality/windows-ui-smoke.ps1 -Binary target/debug/diskunfold.exe -OutputDirectory quality-output/ui-smoke -Tier $tier -ScreenSize 1920x1080
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-smoke-windows
          path: quality-output/ui-smoke/
          if-no-files-found: warn
  reports:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      CARGO_LLVM_COV_VERSION: "0.9.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - name: Linux native prerequisites
        # A slow mirror needs about 17 minutes; the limit only stops a hung download.
        timeout-minutes: 35
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - name: Install Rust and build GUI assets in parallel
        shell: bash
        run: |
          set -euo pipefail
          (rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview && rustup default 1.99.1) &
          pid_rust=$!
          (cd gui-web && npm ci --ignore-scripts && npm run build) &
          pid_gui=$!
          wait "$pid_rust"
          wait "$pid_gui"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.0.1' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      # rust-cache restores ~/.cargo/bin, so after the first saved run this install is skipped.
      - name: Ensure cargo-llvm-cov
        shell: bash
        run: |
          if ! command -v cargo-llvm-cov >/dev/null 2>&1 || [[ "$(cargo-llvm-cov --version)" != "cargo-llvm-cov $CARGO_LLVM_COV_VERSION" ]]; then
            cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
          fi
      - name: Collect Rust and GUI coverage in parallel
        id: parallel_coverage
        if: success() || failure()
        shell: bash
        run: |
          node -e "require('fs').rmSync('gui-web/coverage', {recursive:true, force:true}); require('fs').rmSync('quality-output/gui-tests.json', {force:true})"
          node release-packaging/quality/rust-coverage.mjs &
          pid_rust=$!
          (cd gui-web && npm run test:coverage) &
          pid_gui=$!
          rust_ok=true
          gui_ok=true
          wait "$pid_rust" || rust_ok=false
          wait "$pid_gui" || gui_ok=false
          echo "rust_ok=$rust_ok" >> "$GITHUB_OUTPUT"
          echo "gui_ok=$gui_ok" >> "$GITHUB_OUTPUT"
          [[ "$rust_ok" == true && "$gui_ok" == true ]]
      - id: coverage_base
        name: Download coverage for the exact base commit
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ ( "$BASE_BRANCH" != main && "$BASE_BRANCH" != "0.0.1" ) || ! "$BASE_COMMIT" =~ ^[a-f0-9]{40}$ || "$BASE_COMMIT" =~ ^0+$ ]]; then
            exit 0
          fi
          if ! runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality.yml --branch "$BASE_BRANCH" \
              --commit "$BASE_COMMIT" --event push --status completed --limit 5 --json databaseId --jq '.[].databaseId')"; then
            echo "Coverage baseline lookup unavailable."
            exit 0
          fi
          while IFS= read -r run; do
            [[ "$run" =~ ^[0-9]+$ ]] || continue
            dir="$(mktemp -d "$RUNNER_TEMP/diskunfold-coverage.XXXXXXXX")"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name coverage-baseline --dir "$dir" >/dev/null 2>&1 &&
                [[ -f "$dir/coverage-summary.json" && ! -L "$dir/coverage-summary.json" ]]; then
              echo "path=$dir/coverage-summary.json" >> "$GITHUB_OUTPUT"
              echo "run=$run" >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$runs"
      - if: success() || failure()
        name: Report coverage and change
        env:
          COVERAGE_BASELINE: ${{ steps.coverage_base.outputs.path }}
          COVERAGE_BASE_RUN: ${{ steps.coverage_base.outputs.run }}
          COVERAGE_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_COVERAGE_SUCCEEDED: ${{ steps.parallel_coverage.outputs.rust_ok == 'true' }}
          GUI_COVERAGE_SUCCEEDED: ${{ steps.parallel_coverage.outputs.gui_ok == 'true' }}
        run: node release-packaging/quality/coverage.mjs "$COVERAGE_BASELINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'push'
        with:
          name: coverage-baseline
          path: quality-output/coverage-summary.json
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
