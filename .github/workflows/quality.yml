name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: matrix
        shell: bash
        run: echo "matrix=$(node release-packaging/quality/matrix.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: targets
          path: quality-output/targets.json
  native:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb openbox xdotool dbus-x11
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview && rustup default 1.99.1
      - name: Confirm native architecture
        shell: bash
        run: rustc -vV | grep -F 'host: ${{ matrix.rustTarget }}'
      - name: Install GUI dependencies
        working-directory: gui-web
        run: npm ci --ignore-scripts
      - name: Build GUI assets for Rust
        working-directory: gui-web
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Linux launch smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked -p du-launcher
          bash release-packaging/launcher/smoke-linux.sh target/debug/diskunfold
      - run: cargo run --locked -p du-arch-check --
      - name: GUI checks
        working-directory: gui-web
        run: npm run check && npm run arch && npm run test && npm run build
      - name: Check generated contracts
        shell: bash
        run: |
          cargo run --locked -p du-core-contracts --features typescript --example export_types -- gui-web/src/ipc/generated
          git diff --exit-code -- gui-web/src/ipc/generated
          test -z "$(git ls-files --others --exclude-standard -- gui-web/src/ipc/generated)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.cpu }}
          path: quality-output/
          if-no-files-found: warn
  reports:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26.13.0
      - name: Linux native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb openbox xdotool dbus-x11
      - run: rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview && rustup default 1.99.1
      - working-directory: gui-web
        run: npm ci --ignore-scripts
      - working-directory: gui-web
        run: npm run build
      - run: cargo install --locked cargo-deny --version 0.20.2
      - if: success() || failure()
        run: cargo deny --locked --all-features check advisories licenses sources bans
      - if: success() || failure()
        run: node release-packaging/quality/license-policy.test.mjs
      - if: success() || failure()
        run: node release-packaging/quality/npm-licenses.mjs
      - if: success() || failure()
        run: node release-packaging/quality/dependency-register.mjs
      - if: success() || failure()
        run: cargo install --locked cargo-llvm-cov --version 0.6.21
      - if: success() || failure()
        run: node release-packaging/quality/rust-coverage.mjs
      - if: success() || failure()
        run: node -e "require('fs').rmSync('gui-web/coverage', {recursive:true, force:true}); require('fs').rmSync('quality-output/gui-tests.json', {force:true})"
      - if: success() || failure()
        working-directory: gui-web
        run: npm run test:coverage
      - if: success() || failure()
        run: node release-packaging/quality/coverage.mjs
      - if: success() || failure()
        run: node release-packaging/quality/fuzz.mjs
      - name: Duplication report (50 tokens)
        if: success() || failure()
        run: gui-web/node_modules/.bin/jscpd --min-tokens 50 --reporters json,html --output quality-output/jscpd --ignore '**/node_modules/**,**/target/**,**/gen/**,**/dist/**,**/generated/**,**/coverage/**,**/quality-output/**' .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: quality-reports
          path: |
            quality-output/
            gui-web/coverage/
          if-no-files-found: warn
