name: Quality
on:
  pull_request:
  push:
    branches: [main, 0.0.1]
  # Manual runs exist so a branch can warm and measure the Rust caches (see the caching policy in
  # release-packaging/quality/README.md). They never publish anything.
  workflow_dispatch:
    inputs:
      runner_mode:
        description: "Runner selection mode (auto: real-time self-hosted probe with fallback, github-hosted)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - github-hosted
      ui_smoke_tier:
        description: "UI smoke scenario tier (auto: smoke on PR and all on push/manual, smoke, all)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - smoke
          - all
permissions:
  contents: read
# A newer push to the same pull request replaces the older run. Default-branch pushes and manual
# runs get a unique group and are never cancelled: every commit keeps its own coverage baseline.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('quality-pr-{0}', github.event.pull_request.number) || format('quality-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # CI-only compile settings. Cargo.toml profiles, and so release builds, are untouched.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ui_smoke_runner: ${{ steps.matrix.outputs.ui_smoke_runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - id: matrix
        name: Resolve target runners and fallback
        shell: bash
        env:
          DU_RUNNER_MODE: ${{ inputs.runner_mode || 'auto' }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: node release-packaging/quality/matrix.mjs
      - name: Install GUI dependencies
        working-directory: gui-web
        run: npm ci --ignore-scripts
      - name: Build GUI assets once for all native jobs
        working-directory: gui-web
        run: npm run build
      - name: Stage GUI dist and production license metadata
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const out = "quality-output/gui-dist";
            fs.cpSync("gui-web/dist", path.join(out, "dist"), { recursive: true });
            const lock = JSON.parse(fs.readFileSync("gui-web/package-lock.json", "utf8"));
            const stems = ["LICENSE", "LICENCE", "COPYING", "NOTICE", "UNLICENSE"];
            for (const [pkgPath, pkg] of Object.entries(lock.packages || {})) {
              if (!pkgPath || pkg.dev === true) continue;
              const srcDir = path.join("gui-web", pkgPath);
              if (!fs.existsSync(srcDir)) continue;
              const dstDir = path.join(out, pkgPath);
              fs.mkdirSync(dstDir, { recursive: true });
              for (const entry of fs.readdirSync(srcDir, { withFileTypes: true })) {
                if (!entry.isFile()) continue;
                const upper = entry.name.toUpperCase();
                if (entry.name === "package.json" || stems.some((s) => upper.startsWith(s))) {
                  fs.cpSync(path.join(srcDir, entry.name), path.join(dstDir, entry.name));
                }
              }
            }
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targets
          path: quality-output/targets.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-dist
          path: quality-output/gui-dist/
          if-no-files-found: error
  # Unified native target check: one job per (OS, CPU) target so self-hosted runners (1 per target)
  # never queue two competing jobs on the same machine, and pre-built GUI assets are reused.
  native:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download pre-built GUI assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-dist
          path: gui-web
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        # A slow mirror needs about 17 minutes; the limit only stops a hung download.
        timeout-minutes: 35
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config xvfb openbox xdotool dbus-x11
      - name: Install pinned Rust
        shell: bash
        run: |
          if ! rustup toolchain list | grep -q "^1\.99\.1"; then
            rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          fi
          rustup component add --toolchain 1.99.1 clippy
          rustup default 1.99.1
      - name: Confirm native architecture
        shell: bash
        env:
          EXPECTED_RUST_TARGET: ${{ matrix.rustTarget }}
        run: |
          rustc -vV | grep -Fx "host: $EXPECTED_RUST_TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}-${{ matrix.cpu }}-${{ matrix.rustTarget }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.0.1' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The CLI-only launcher (README, AGENTS.md) builds app-host without its gui feature.
      - run: cargo clippy --locked -p du-launcher -p du-app-host --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-features
      - name: Windows NTFS volume mount-point observation
        if: runner.os == 'Windows' && matrix.cpu == 'x64'
        run: cargo test --locked -p du-platform-os --test windows_mountpoint -- --ignored --nocapture
      # A separate install keeps the cache key of the GTK and WebKit packages unchanged.
      - name: Linux btrfs tools
        if: runner.os == 'Linux' && matrix.cpu == 'x64'
        timeout-minutes: 10
        uses: ./.github/actions/apt-install
        with:
          packages: btrfs-progs
      - name: Linux btrfs subvolume observation
        if: runner.os == 'Linux' && matrix.cpu == 'x64'
        shell: bash
        # A fresh loop image: subvolumes first, second and second/nested (IDs 256, 257, 258).
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/du-btrfs.img"
          root="$RUNNER_TEMP/du-btrfs"
          rm -f "$image"
          mkdir -p "$root"
          truncate -s 256M "$image"
          mkfs.btrfs -q "$image"
          sudo -n mount -o loop "$image" "$root"
          trap 'sudo -n umount "$root" || sudo -n umount -l "$root"; rm -f "$image"; rmdir "$root"' EXIT
          for name in first second second/nested; do
            sudo -n btrfs subvolume create "$root/$name"
          done
          sudo -n chown -R "$(id -u):$(id -g)" "$root"
          mkdir "$root/plain"
          printf '0123456789' > "$root/plain/a.bin"
          printf '%020d' 0 > "$root/first/b.bin"
          printf '12345' > "$root/second/c.bin"
          export DU_TEST_BTRFS_ROOT="$root"
          cargo test --locked -p du-platform-os --test linux_btrfs_subvolume -- --ignored --nocapture
          cargo test --locked -p du-app-host --all-features --lib linux_scan_leaves_btrfs_subvolumes_outside_the_boundary -- --ignored --nocapture
      # Ubuntu 24.04 runners set kernel.apparmor_restrict_unprivileged_userns=1, which
      # blocks the unprivileged user namespace that WebKitGTK's bubblewrap sandbox needs
      # ("bwrap: setting up uid map: Permission denied"), so the web process hangs until
      # the smoke times out (exit 124). The sandbox stays enabled: we lift the host
      # restriction on this runner instead of setting WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS.
      - name: Allow unprivileged user namespaces for the WebKit sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Linux launch smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked -p du-launcher
          bash release-packaging/launcher/smoke-linux.sh target/debug/diskunfold
          xvfb-run -a dbus-run-session cargo test --locked -p du-platform-os --features webview linux_webview_smoke -- --ignored
      - run: cargo run --locked -p du-arch-check --
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.cpu }}
          path: quality-output/
          if-no-files-found: warn
  # Platform-independent formatting, architecture, contract diff, GUI checks/tests, dependency,
  # license, workflow and duplication policy on a fast GitHub-hosted Linux runner.
  policy:
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: policy
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.0.1' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - working-directory: gui-web
        run: npm ci --ignore-scripts
      - run: cargo fmt --all -- --check
      - run: cargo run --locked -p du-arch-check --
      - name: Check generated contracts
        shell: bash
        run: |
          generated_dir=$(mktemp -d)
          cargo run --locked -p du-core-contracts --features typescript --example export_types -- "$generated_dir"
          git diff --no-index --no-ext-diff -- gui-web/src/ipc/generated "$generated_dir"
      - name: GUI checks and unit tests
        working-directory: gui-web
        run: npm run check && npm run test
      - name: Windows folder-drop bridge checks
        run: node --test platform-os/tests/windows_drop_bridge.test.cjs
      # rust-cache restores ~/.cargo/bin, so after the first saved run this install is skipped.
      - name: Ensure cargo-deny
        shell: bash
        run: |
          if ! command -v cargo-deny >/dev/null 2>&1 || [[ "$(cargo-deny --version)" != "cargo-deny $CARGO_DENY_VERSION" ]]; then
            cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          fi
      - if: success() || failure()
        run: cargo deny --locked --all-features check advisories licenses sources bans
      - if: success() || failure()
        run: node --test release-packaging/quality/npm-licenses.test.mjs
      - if: success() || failure()
        run: node --test release-packaging/quality/windows-ui-smoke.test.mjs
      - if: success() || failure()
        run: node release-packaging/quality/npm-licenses.mjs
      - if: success() || failure()
        run: node release-packaging/quality/dependency-register.mjs
      - if: success() || failure()
        name: Release workflow policy
        run: |
          node --test release-packaging/release
          node release-packaging/release/lint-workflow.mjs
      - if: success() || failure()
        run: |
          node --test release-packaging/quality/coverage.test.mjs
          node --test release-packaging/quality/matrix.test.mjs
          node --test release-packaging/quality/fuzz.test.mjs
          node release-packaging/quality/fuzz.mjs --check
      - name: Duplication report (50 tokens)
        if: success() || failure()
        run: gui-web/node_modules/.bin/jscpd --min-tokens 50 --reporters json,html --output quality-output/jscpd --ignore '**/node_modules/**,**/target/**,**/gen/**,**/dist/**,**/generated/**,**/coverage/**,**/quality-output/**' .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-policy
          path: quality-output/
          if-no-files-found: warn
  # Real WebView2 window on the Windows x64 runner (self-hosted when online, falling back to
  # GitHub-hosted windows-2022): runs the scenarios of release-packaging/quality/windows-ui-smoke.json
  # with smoke-windows.ps1 and keeps the logs and review captures as an artifact.
  ui-smoke:
    needs: targets
    runs-on: ${{ fromJSON(needs.targets.outputs.ui_smoke_runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download pre-built GUI assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-dist
          path: gui-web
      - name: Install pinned Rust
        shell: bash
        run: |
          if ! rustup toolchain list | grep -q "^1\.99\.1"; then
            rustup toolchain install 1.99.1 --profile minimal
          fi
          rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-ui-smoke
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.0.1' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - run: cargo build --locked -p du-launcher
      - name: Run UI scenarios
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TIER: ${{ inputs.ui_smoke_tier || 'auto' }}
        run: |
          $tier = if ($env:REQUESTED_TIER -in @('smoke', 'all')) {
            $env:REQUESTED_TIER
          } elseif ($env:EVENT_NAME -eq 'pull_request') {
            'smoke'
          } else {
            'all'
          }
          "Running Windows UI smoke with tier '$tier'"
          ./release-packaging/quality/windows-ui-smoke.ps1 -Binary target/debug/diskunfold.exe -OutputDirectory quality-output/ui-smoke -Tier $tier -ScreenSize 1920x1080
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-smoke-windows
          path: quality-output/ui-smoke/
          if-no-files-found: warn
  reports:
    needs: targets
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      CARGO_LLVM_COV_VERSION: "0.9.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - name: Linux native prerequisites
        # A slow mirror needs about 17 minutes; the limit only stops a hung download.
        timeout-minutes: 35
        uses: ./.github/actions/apt-install
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/0.0.1' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - working-directory: gui-web
        run: npm ci --ignore-scripts
      - name: Download pre-built GUI assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-dist
          path: gui-web
      # rust-cache restores ~/.cargo/bin, so after the first saved run this install is skipped.
      - name: Ensure cargo-llvm-cov
        shell: bash
        run: |
          if ! command -v cargo-llvm-cov >/dev/null 2>&1 || [[ "$(cargo-llvm-cov --version)" != "cargo-llvm-cov $CARGO_LLVM_COV_VERSION" ]]; then
            cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
          fi
      - id: rust_coverage
        if: success() || failure()
        run: node release-packaging/quality/rust-coverage.mjs
      - if: success() || failure()
        run: node -e "require('fs').rmSync('gui-web/coverage', {recursive:true, force:true}); require('fs').rmSync('quality-output/gui-tests.json', {force:true})"
      - id: gui_coverage
        if: success() || failure()
        working-directory: gui-web
        run: npm run test:coverage
      - id: coverage_base
        name: Download coverage for the exact base commit
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ ( "$BASE_BRANCH" != main && "$BASE_BRANCH" != "0.0.1" ) || ! "$BASE_COMMIT" =~ ^[a-f0-9]{40}$ || "$BASE_COMMIT" =~ ^0+$ ]]; then
            exit 0
          fi
          if ! runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality.yml --branch "$BASE_BRANCH" \
              --commit "$BASE_COMMIT" --event push --status completed --limit 5 --json databaseId --jq '.[].databaseId')"; then
            echo "Coverage baseline lookup unavailable."
            exit 0
          fi
          while IFS= read -r run; do
            [[ "$run" =~ ^[0-9]+$ ]] || continue
            dir="$(mktemp -d "$RUNNER_TEMP/diskunfold-coverage.XXXXXXXX")"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name coverage-baseline --dir "$dir" >/dev/null 2>&1 &&
                [[ -f "$dir/coverage-summary.json" && ! -L "$dir/coverage-summary.json" ]]; then
              echo "path=$dir/coverage-summary.json" >> "$GITHUB_OUTPUT"
              echo "run=$run" >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$runs"
      - if: success() || failure()
        name: Report coverage and change
        env:
          COVERAGE_BASELINE: ${{ steps.coverage_base.outputs.path }}
          COVERAGE_BASE_RUN: ${{ steps.coverage_base.outputs.run }}
          COVERAGE_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_COVERAGE_SUCCEEDED: ${{ steps.rust_coverage.outcome == 'success' }}
          GUI_COVERAGE_SUCCEEDED: ${{ steps.gui_coverage.outcome == 'success' }}
        run: node release-packaging/quality/coverage.mjs "$COVERAGE_BASELINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'push'
        with:
          name: coverage-baseline
          path: quality-output/coverage-summary.json
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-reports
          path: |
            quality-output/
            gui-web/coverage/
          if-no-files-found: warn
