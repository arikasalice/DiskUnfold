name: Quality
on:
  pull_request:
  push:
    branches: [main]
  # Manual runs exist so a branch can warm and measure the Rust caches (see the caching policy in
  # release-packaging/quality/README.md). They never publish anything.
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request replaces the older run. Main pushes and manual runs get a
# unique group and are never cancelled: every main commit keeps its own coverage baseline.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('quality-pr-{0}', github.event.pull_request.number) || format('quality-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  # CI-only compile settings. Cargo.toml profiles, and so release builds, are untouched.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        shell: bash
        run: echo "matrix=$(node release-packaging/quality/matrix.mjs)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targets
          path: quality-output/targets.json
  # Lint and GUI checks run beside the test job of the same native target instead of queueing in
  # front of it. Both jobs run on every native target.
  lint:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview && rustup default 1.99.1
      - name: Confirm native architecture
        shell: bash
        env:
          EXPECTED_RUST_TARGET: ${{ matrix.rustTarget }}
        run: |
          rustc -vV | grep -Fx "host: $EXPECTED_RUST_TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}-${{ matrix.cpu }}-${{ matrix.rustTarget }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - name: Install GUI dependencies
        working-directory: gui-web
        run: npm ci --ignore-scripts
      - name: Build GUI assets for Rust
        working-directory: gui-web
        run: npm run build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: GUI checks
        working-directory: gui-web
        run: npm run check && npm run test
      - name: Windows folder-drop bridge checks
        if: runner.os == 'Windows'
        run: node --test platform-os/tests/windows_drop_bridge.test.cjs
  native:
    needs: targets
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config xvfb openbox xdotool dbus-x11
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview && rustup default 1.99.1
      - name: Confirm native architecture
        shell: bash
        env:
          EXPECTED_RUST_TARGET: ${{ matrix.rustTarget }}
        run: |
          rustc -vV | grep -Fx "host: $EXPECTED_RUST_TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}-${{ matrix.cpu }}-${{ matrix.rustTarget }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - name: Install GUI dependencies
        working-directory: gui-web
        run: npm ci --ignore-scripts
      - name: Build GUI assets for Rust
        working-directory: gui-web
        run: npm run build
      - run: cargo test --locked --workspace --all-features
      # Ubuntu 24.04 runners set kernel.apparmor_restrict_unprivileged_userns=1, which
      # blocks the unprivileged user namespace that WebKitGTK's bubblewrap sandbox needs
      # ("bwrap: setting up uid map: Permission denied"), so the web process hangs until
      # the smoke times out (exit 124). The sandbox stays enabled: we lift the host
      # restriction on this disposable runner instead of setting
      # WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS. Only this job needs it; fuzz.yml and
      # release.yml never start a WebKit view.
      - name: Allow unprivileged user namespaces for the WebKit sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Linux launch smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked -p du-launcher
          bash release-packaging/launcher/smoke-linux.sh target/debug/diskunfold
          xvfb-run -a dbus-run-session cargo test --locked -p du-platform-os --features webview linux_webview_smoke -- --ignored
      - run: cargo run --locked -p du-arch-check --
      - name: Check generated contracts
        shell: bash
        run: |
          generated_dir=$(mktemp -d)
          cargo run --locked -p du-core-contracts --features typescript --example export_types -- "$generated_dir"
          git diff --no-index --no-ext-diff -- gui-web/src/ipc/generated "$generated_dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-${{ matrix.os }}-${{ matrix.cpu }}
          path: quality-output/
          if-no-files-found: warn
  # Dependency, license, workflow and duplication policy. It needs no GTK/WebKit packages and no
  # GUI build, and it runs beside the coverage job.
  policy:
    runs-on: ubuntu-24.04
    env:
      CARGO_DENY_VERSION: "0.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: policy
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - working-directory: gui-web
        run: npm ci --ignore-scripts
      # rust-cache restores ~/.cargo/bin, so after the first saved run this install is a no-op.
      - run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
      - if: success() || failure()
        run: cargo deny --locked --all-features check advisories licenses sources bans
      - if: success() || failure()
        run: node --test release-packaging/quality/npm-licenses.test.mjs
      - if: success() || failure()
        run: node release-packaging/quality/npm-licenses.mjs
      - if: success() || failure()
        run: node release-packaging/quality/dependency-register.mjs
      - if: success() || failure()
        name: Release workflow policy
        run: |
          node --test release-packaging/release
          node release-packaging/release/lint-workflow.mjs
      - if: success() || failure()
        run: |
          node --test release-packaging/quality/coverage.test.mjs
          node --test release-packaging/quality/fuzz.test.mjs
          node release-packaging/quality/fuzz.mjs --check
      - name: Duplication report (50 tokens)
        if: success() || failure()
        run: gui-web/node_modules/.bin/jscpd --min-tokens 50 --reporters json,html --output quality-output/jscpd --ignore '**/node_modules/**,**/target/**,**/gen/**,**/dist/**,**/generated/**,**/coverage/**,**/quality-output/**' .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-policy
          path: quality-output/
          if-no-files-found: warn
  reports:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      CARGO_LLVM_COV_VERSION: "0.9.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - name: Linux native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev build-essential pkg-config
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --component llvm-tools-preview && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          cache-on-failure: true
      - working-directory: gui-web
        run: npm ci --ignore-scripts
      - working-directory: gui-web
        run: npm run build
      # rust-cache restores ~/.cargo/bin, so after the first saved run this install is a no-op.
      - run: cargo install --locked cargo-llvm-cov --version "$CARGO_LLVM_COV_VERSION"
      - id: rust_coverage
        if: success() || failure()
        run: node release-packaging/quality/rust-coverage.mjs
      - if: success() || failure()
        run: node -e "require('fs').rmSync('gui-web/coverage', {recursive:true, force:true}); require('fs').rmSync('quality-output/gui-tests.json', {force:true})"
      - id: gui_coverage
        if: success() || failure()
        working-directory: gui-web
        run: npm run test:coverage
      - id: coverage_base
        name: Download coverage for the exact base commit
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$BASE_BRANCH" != main || ! "$BASE_COMMIT" =~ ^[a-f0-9]{40}$ || "$BASE_COMMIT" =~ ^0+$ ]]; then
            exit 0
          fi
          if ! runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality.yml --branch main \
              --commit "$BASE_COMMIT" --event push --status completed --limit 5 --json databaseId --jq '.[].databaseId')"; then
            echo "Coverage baseline lookup unavailable."
            exit 0
          fi
          while IFS= read -r run; do
            [[ "$run" =~ ^[0-9]+$ ]] || continue
            dir="$(mktemp -d "$RUNNER_TEMP/diskunfold-coverage.XXXXXXXX")"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name coverage-baseline --dir "$dir" >/dev/null 2>&1 &&
                [[ -f "$dir/coverage-summary.json" && ! -L "$dir/coverage-summary.json" ]]; then
              echo "path=$dir/coverage-summary.json" >> "$GITHUB_OUTPUT"
              echo "run=$run" >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$runs"
      - if: success() || failure()
        name: Report coverage and change
        env:
          COVERAGE_BASELINE: ${{ steps.coverage_base.outputs.path }}
          COVERAGE_BASE_RUN: ${{ steps.coverage_base.outputs.run }}
          COVERAGE_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_COVERAGE_SUCCEEDED: ${{ steps.rust_coverage.outcome == 'success' }}
          GUI_COVERAGE_SUCCEEDED: ${{ steps.gui_coverage.outcome == 'success' }}
        run: node release-packaging/quality/coverage.mjs "$COVERAGE_BASELINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'push'
        with:
          name: coverage-baseline
          path: quality-output/coverage-summary.json
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-reports
          path: |
            quality-output/
            gui-web/coverage/
          if-no-files-found: warn
