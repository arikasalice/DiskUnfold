name: Quality
# Tiers (see release-packaging/quality/README.md):
#   pull_request            the native targets marked prCheck in targets.json (all six), static checks, Windows UI smoke only when GUI code changed.
#   push to main / 0.0.1    the pull request set plus the full UI smoke, coverage and duplication report; saves caches.
#   schedule / manual full  all six native targets, UI smoke with the treemap repeat, coverage and duplication report.
on:
  pull_request:
  push:
    branches: [main, 0.0.1]
  schedule:
    # Every six hours (00:37, 06:37, 12:37 and 18:37 UTC; 09:37, 15:37, 21:37 and 03:37 in Korea).
    # The gate job ends the run when the last successful scheduled run saw the same commit.
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: Run all six native targets and the UI smoke repeat
        type: boolean
        default: true
      save_cache:
        description: Save the Rust and apt caches of this run (to warm or measure a branch; only that branch can read them)
        type: boolean
        default: false
permissions:
  contents: read
# A newer push to the same pull request or branch replaces the older run, so only the latest commit
# queues for the scarce macOS and Windows runners. Scheduled and manual runs are never replaced.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('quality-pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && format('quality-push-{0}', github.ref) || format('quality-{0}-{1}', github.event_name, github.run_id)) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
env:
  # CI-only compile settings. Cargo.toml profiles, and so release builds, are untouched.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short
  # Caches are saved only by pushes to the default branch, by the scheduled run and by a manual run
  # with save_cache=true. Pull requests and other manual runs restore caches and never write them.
  CACHE_SAVE: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || (github.event_name == 'workflow_dispatch' && inputs.save_cache) }}
  # One package list for every Linux job keeps a single apt cache per CPU architecture.
  LINUX_PACKAGES: libgtk-4-dev libwebkitgtk-6.0-dev pkg-config xvfb openbox xdotool dbus-x11 btrfs-progs
jobs:
  # Scheduled runs stop here when the last successful scheduled run already covered this commit.
  gate:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          run=true
          if [[ "$EVENT" == schedule ]]; then
            last="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$REPO/actions/workflows/quality.yml/runs?event=schedule&status=success&per_page=1" \
              | grep -m1 -o '"head_sha": *"[0-9a-f]\{40\}"' | grep -o '[0-9a-f]\{40\}' || true)"
            if [[ "$last" == "$COMMIT" ]]; then
              run=false
              echo "The last successful scheduled run already covered $COMMIT; nothing to do."
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  # Builds the GUI assets once and decides which targets and UI smoke shards this run needs.
  prepare:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ui_smoke: ${{ steps.plan.outputs.ui_smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tier=pr
          ui_smoke=true
          if [[ "$EVENT" == schedule || ( "$EVENT" == workflow_dispatch && "$FULL_INPUT" == true ) ]]; then
            tier=full
          fi
          if [[ "$EVENT" == pull_request ]]; then
            # Parts of the repository whose change can alter what the Windows window shows.
            gui='^(gui-web/|app-host/|platform-os/|user-env/|core-contracts/|engine-api/|analysis-index/|scan-engine/|job-runtime/|app-db/|snapshot-store/|snapshot-files/|release-packaging/launcher/|release-packaging/quality/windows-ui-smoke|Cargo\.lock$|\.github/workflows/quality\.yml$)'
            files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
            if grep -Eq "$gui" <<< "$files"; then ui_smoke=true; else ui_smoke=false; fi
          fi
          matrix="$(node release-packaging/quality/matrix.mjs --tier "$tier")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "ui_smoke=$ui_smoke" >> "$GITHUB_OUTPUT"
          echo "tier=$tier ui_smoke=$ui_smoke"
      - name: Install GUI dependencies
        working-directory: gui-web
        run: npm ci --ignore-scripts
      - name: Build GUI assets for Rust
        working-directory: gui-web
        run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-dist
          path: gui-web/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: targets
          path: quality-output/targets.json
  # Platform independent checks run once, here, beside the native jobs.
  static:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: static
          save-if: ${{ env.CACHE_SAVE == 'true' }}
          cache-on-failure: true
      - working-directory: gui-web
        run: npm ci --ignore-scripts
      # Pinned prebuilt binary with a verified checksum instead of a source build on every run.
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-deny@0.20.2
      - run: cargo fmt --all -- --check
      - name: GUI checks
        if: success() || failure()
        working-directory: gui-web
        run: npm run check && npm run test
      - name: Windows folder-drop bridge checks
        if: success() || failure()
        run: node --test platform-os/tests/windows_drop_bridge.test.cjs
      - if: success() || failure()
        run: cargo run --locked -p du-arch-check --
      - name: Check generated contracts
        if: success() || failure()
        shell: bash
        run: |
          generated_dir=$(mktemp -d)
          cargo run --locked -p du-core-contracts --features typescript --example export_types -- "$generated_dir"
          git diff --no-index --no-ext-diff -- gui-web/src/ipc/generated "$generated_dir"
      - if: success() || failure()
        run: cargo deny --locked --all-features check advisories licenses sources bans
      - name: Debian copyright file matches its generator
        if: success() || failure()
        run: cargo test --locked -p du-release-tools --test debian_copyright_repo
      - if: success() || failure()
        run: node --test release-packaging/quality/npm-licenses.test.mjs
      - if: success() || failure()
        run: node --test release-packaging/quality/windows-ui-smoke.test.mjs
      - if: success() || failure()
        run: node release-packaging/quality/npm-licenses.mjs
      - if: success() || failure()
        run: node release-packaging/quality/dependency-register.mjs
      - if: success() || failure()
        name: Release workflow policy
        run: |
          node --test release-packaging/release
          node release-packaging/release/lint-workflow.mjs
      - if: success() || failure()
        run: |
          node --test release-packaging/quality/coverage.test.mjs
          node --test release-packaging/quality/matrix.test.mjs
          node --test release-packaging/quality/fuzz.test.mjs
          node release-packaging/quality/fuzz.mjs --check
      # The report has no threshold, so pull requests skip it.
      - name: Duplication report (50 tokens)
        if: (success() || failure()) && github.event_name != 'pull_request'
        run: gui-web/node_modules/.bin/jscpd --min-tokens 50 --reporters json,html --output quality-output/jscpd --ignore '**/node_modules/**,**/target/**,**/gen/**,**/dist/**,**/generated/**,**/coverage/**,**/quality-output/**' .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-policy
          path: quality-output/
          if-no-files-found: warn
  # Lint and tests of one native target in one job: the clippy and test builds share the restored
  # dependency cache, and one runner per target avoids two jobs queueing for the same scarce OS.
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        # A slow mirror needs about 17 minutes; the limit only stops a hung download.
        timeout-minutes: 35
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          save-cache: ${{ env.CACHE_SAVE }}
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy && rustup default 1.99.1
      - name: Confirm native architecture
        shell: bash
        env:
          EXPECTED_RUST_TARGET: ${{ matrix.rustTarget }}
        run: |
          rustc -vV | grep -Fx "host: $EXPECTED_RUST_TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-${{ matrix.os }}-${{ matrix.cpu }}
          save-if: ${{ env.CACHE_SAVE == 'true' }}
          cache-on-failure: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-dist
          path: gui-web/dist
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The CLI-only launcher (README, AGENTS.md) builds app-host without its gui feature.
      - run: cargo clippy --locked -p du-launcher -p du-app-host --no-default-features --all-targets -- -D warnings
      # committed_debian_copyright_matches_the_generator reads the npm license files in
      # gui-web/node_modules and gives the same result on every OS; the static job runs it once.
      - run: cargo test --locked --workspace --all-features -- --skip committed_debian_copyright_matches_the_generator
      - name: Windows NTFS volume mount-point observation
        if: runner.os == 'Windows' && matrix.cpu == 'x64'
        run: cargo test --locked -p du-platform-os --test windows_mountpoint -- --ignored --nocapture
      - name: Linux btrfs subvolume observation
        if: runner.os == 'Linux' && matrix.cpu == 'x64'
        shell: bash
        # A fresh loop image: subvolumes first, second and second/nested (IDs 256, 257, 258).
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/du-btrfs.img"
          root="$RUNNER_TEMP/du-btrfs"
          test ! -e "$image"
          mkdir "$root"
          truncate -s 256M "$image"
          mkfs.btrfs -q "$image"
          sudo -n mount -o loop "$image" "$root"
          trap 'sudo -n umount "$root" || sudo -n umount -l "$root"; rm -f "$image"; rmdir "$root"' EXIT
          for name in first second second/nested; do
            sudo -n btrfs subvolume create "$root/$name"
          done
          sudo -n chown -R "$(id -u):$(id -g)" "$root"
          mkdir "$root/plain"
          printf '0123456789' > "$root/plain/a.bin"
          printf '%020d' 0 > "$root/first/b.bin"
          printf '12345' > "$root/second/c.bin"
          export DU_TEST_BTRFS_ROOT="$root"
          cargo test --locked -p du-platform-os --test linux_btrfs_subvolume -- --ignored --nocapture
          cargo test --locked -p du-app-host --all-features --lib linux_scan_leaves_btrfs_subvolumes_outside_the_boundary -- --ignored --nocapture
      # Ubuntu 24.04 runners set kernel.apparmor_restrict_unprivileged_userns=1, which
      # blocks the unprivileged user namespace that WebKitGTK's bubblewrap sandbox needs
      # ("bwrap: setting up uid map: Permission denied"), so the web process hangs until
      # the smoke times out (exit 124). The sandbox stays enabled: we lift the host
      # restriction on this disposable runner instead of setting
      # WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS. Only this job needs it; fuzz.yml and
      # release.yml never start a WebKit view.
      - name: Allow unprivileged user namespaces for the WebKit sandbox
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Linux launch smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked -p du-launcher
          bash release-packaging/launcher/smoke-linux.sh target/debug/diskunfold
          xvfb-run -a dbus-run-session cargo test --locked -p du-platform-os --features webview linux_webview_smoke -- --ignored
  # Real WebView2 window on a GitHub-hosted Windows runner: runs the scenarios of
  # release-packaging/quality/windows-ui-smoke.json with smoke-windows.ps1 in three shards and keeps
  # the logs and review captures as artifacts. Pull requests run it only when GUI code changed.
  # Not a required check; see the quality guide.
  ui-smoke:
    needs: prepare
    if: needs.prepare.outputs.ui_smoke == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1
      # Reads the cache the windows-x64 native job saves; never writes one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-windows-x64
          save-if: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-dist
          path: gui-web/dist
      - run: cargo build --locked -p du-launcher
      - name: Run UI scenarios
        shell: pwsh
        run: ./release-packaging/quality/windows-ui-smoke.ps1 -Binary target/debug/diskunfold.exe -OutputDirectory quality-output/ui-smoke -ScreenSize 1920x1080 -Shard ${{ matrix.shard }} -ShardCount 3
      # #155: the first folder open right after an analysis failed now and then in these scenarios.
      # The repeat takes minutes, so only the scheduled and full manual runs do it, in shard 1.
      - name: Repeat the treemap scenarios
        if: (success() || failure()) && matrix.shard == 1 && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full))
        shell: pwsh
        run: ./release-packaging/quality/windows-ui-smoke.ps1 -Binary target/debug/diskunfold.exe -OutputDirectory quality-output/ui-smoke/repeat -Only treemap,treemap-narrow -Repeat 3 -ScreenSize 1920x1080
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-smoke-windows-${{ matrix.shard }}
          path: quality-output/ui-smoke/
          if-no-files-found: warn
  # Coverage is informational. Pull requests skip it; pushes and the scheduled run report it.
  reports:
    needs: prepare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: gui-web/package-lock.json
      - name: Linux native prerequisites
        # A slow mirror needs about 17 minutes; the limit only stops a hung download.
        timeout-minutes: 35
        uses: ./.github/actions/apt-install
        with:
          packages: ${{ env.LINUX_PACKAGES }}
          save-cache: ${{ env.CACHE_SAVE }}
      - run: rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview && rustup default 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: coverage
          save-if: ${{ env.CACHE_SAVE == 'true' }}
          cache-on-failure: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gui-dist
          path: gui-web/dist
      - working-directory: gui-web
        run: npm ci --ignore-scripts
      # Pinned prebuilt binary with a verified checksum instead of a source build on every run.
      - uses: taiki-e/install-action@25f51f6b1bf4e18876107cece836f4f77ac17c8c # v2.90.7
        with:
          tool: cargo-llvm-cov@0.9.1
      - id: rust_coverage
        if: success() || failure()
        run: node release-packaging/quality/rust-coverage.mjs
      - if: success() || failure()
        run: node -e "require('fs').rmSync('gui-web/coverage', {recursive:true, force:true}); require('fs').rmSync('quality-output/gui-tests.json', {force:true})"
      - id: gui_coverage
        if: success() || failure()
        working-directory: gui-web
        run: npm run test:coverage
      - id: coverage_base
        name: Download coverage for the exact base commit
        if: success() || failure()
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ "$BASE_BRANCH" != "$DEFAULT_BRANCH" || ! "$BASE_COMMIT" =~ ^[a-f0-9]{40}$ || "$BASE_COMMIT" =~ ^0+$ ]]; then
            exit 0
          fi
          if ! runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quality.yml --branch "$DEFAULT_BRANCH" \
              --commit "$BASE_COMMIT" --event push --status completed --limit 5 --json databaseId --jq '.[].databaseId')"; then
            echo "Coverage baseline lookup unavailable."
            exit 0
          fi
          while IFS= read -r run; do
            [[ "$run" =~ ^[0-9]+$ ]] || continue
            dir="$(mktemp -d "$RUNNER_TEMP/diskunfold-coverage.XXXXXXXX")"
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name coverage-baseline --dir "$dir" >/dev/null 2>&1 &&
                [[ -f "$dir/coverage-summary.json" && ! -L "$dir/coverage-summary.json" ]]; then
              echo "path=$dir/coverage-summary.json" >> "$GITHUB_OUTPUT"
              echo "run=$run" >> "$GITHUB_OUTPUT"
              break
            fi
          done <<< "$runs"
      - if: success() || failure()
        name: Report coverage and change
        env:
          COVERAGE_BASELINE: ${{ steps.coverage_base.outputs.path }}
          COVERAGE_BASE_RUN: ${{ steps.coverage_base.outputs.run }}
          COVERAGE_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
          RUST_COVERAGE_SUCCEEDED: ${{ steps.rust_coverage.outcome == 'success' }}
          GUI_COVERAGE_SUCCEEDED: ${{ steps.gui_coverage.outcome == 'success' }}
        run: node release-packaging/quality/coverage.mjs "$COVERAGE_BASELINE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && github.event_name == 'push'
        with:
          name: coverage-baseline
          path: quality-output/coverage-summary.json
          if-no-files-found: warn
          overwrite: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: quality-reports
          path: |
            quality-output/
            gui-web/coverage/
          if-no-files-found: warn
