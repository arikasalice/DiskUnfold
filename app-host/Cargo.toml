[package]
name = "du-app-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
gui = ["dep:du-app-db", "dep:du-core-contracts", "dep:du-engine-api", "dep:du-mcp-gateway", "dep:du-platform-os", "dep:du-user-env", "dep:serde", "dep:serde_json", "dep:sha2", "du-platform-os/webview"]

[dependencies]
du-core-contracts = { version = "0.1.0", path = "../core-contracts", optional = true }
du-engine-api = { version = "0.1.0", path = "../engine-api", optional = true }
du-mcp-gateway = { version = "0.1.0", path = "../mcp-gateway", optional = true }
du-platform-os = { version = "0.1.0", path = "../platform-os", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
du-platform-os = { version = "0.1.0", path = "../platform-os", features = ["fake"] }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dependencies]
du-app-db = { version = "0.1.0", path = "../app-db", optional = true }
du-user-env = { version = "0.1.0", path = "../user-env", optional = true }

[target.'cfg(any(windows, target_os = "linux", target_os = "macos"))'.dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[[example]]
name = "q8_recent"
required-features = ["gui"]

[lints]
workspace = true
